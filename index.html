<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickSell - Sell Your Waste Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-success sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">♻ QuickSell</a>
      <div>
        <a href="#sell" class="btn btn-light btn-sm me-1">Sell Product</a>
        <a href="#products" class="btn btn-outline-light btn-sm">Browse</a>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero text-center text-white">
    <div class="container">
      <h1 class="fw-bold">Unused products-ku second life kudunga</h1>
      <p class="lead mb-0">Old newspaper, plastic, cardboard, metal, e-waste, furniture - list pannunga, buyers neradiya contact pannuvaanga.</p>
    </div>
  </header>

  <div class="container py-4">

    <!-- Sell form (Seller) -->
    <section id="sell" class="mb-5">
      <div class="card shadow-sm">
        <div class="card-header bg-white"><h4 class="mb-0 text-success">Sell Your Product</h4></div>
        <div class="card-body">
          <form id="productForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Product Name *</label>
                <input name="name" class="form-control" placeholder="e.g. Old Newspapers" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Category *</label>
                <select name="category" class="form-select" required>
                  <option value="">Select category</option>
                  <option>Paper</option>
                  <option>Plastic</option>
                  <option>Cardboard</option>
                  <option>Metal</option>
                  <option>E-waste</option>
                  <option>Furniture</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Quantity *</label>
                <input name="quantity" class="form-control" placeholder="e.g. 10 kg / 5 pieces" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Price (₹) *</label>
                <input name="price" type="number" min="0" class="form-control" placeholder="e.g. 150" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Location *</label>
                <input name="location" class="form-control" placeholder="e.g. Chennai" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Your Name *</label>
                <input name="sellerName" class="form-control" placeholder="Seller name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Contact Number *</label>
                <input name="contact" class="form-control" placeholder="10 digit mobile number"
                       pattern="[0-9]{10}" maxlength="10" title="10 digit number type pannunga" required>
              </div>
              <div class="col-12">
                <label class="form-label">Description</label>
                <textarea name="description" rows="2" class="form-control" placeholder="Product pathi sila vari"></textarea>
              </div>
              <div class="col-12">
                <label class="form-label">Product Image (max 2 MB)</label>
                <input name="image" type="file" accept="image/*" class="form-control">
              </div>
            </div>
            <button id="saveBtn" class="btn btn-success mt-3 px-4">Save Product</button>
            <span id="msg" class="ms-3"></span>
          </form>
        </div>
      </div>
    </section>

    <!-- Listed products (User) -->
    <section id="products">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h4 class="mb-0 text-success">Listed Products</h4>
        <div class="d-flex gap-2">
          <input id="search" class="form-control" placeholder="Search product...">
          <select id="filterCategory" class="form-select">
            <option value="">All</option>
            <option>Paper</option>
            <option>Plastic</option>
            <option>Cardboard</option>
            <option>Metal</option>
            <option>E-waste</option>
            <option>Furniture</option>
            <option>Other</option>
          </select>
        </div>
      </div>
      <div id="list" class="row"></div>
    </section>
  </div>

  <footer class="text-center py-3 bg-success text-white">
    <small>♻ QuickSell - Give unused products a second life</small>
  </footer>

  <!-- Product details popup -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" id="detailBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
